[project]
name = "quanteeze"
version = "0.8.0"
description = "Fast uniform least-squares quantization and speculative MoE serving on Apple Silicon and CUDA"
readme = "README.md"
license = "GPL-2.0-only OR LicenseRef-PolyForm-Shield-1.0.0"
license-files = [
    "LICENSE",
    "LICENSE-GPL-2.0",
    "LICENSE-POLYFORM-SHIELD",
    "docs/images/Montserrat-OFL.txt",
]
authors = [{ name = "Kentaro Kitagawa" }]
requires-python = ">=3.12"
keywords = [
    "llm",
    "vlm",
    "moe",
    "mlx",
    "quantization",
    "inference",
    "apple-silicon",
    "metal",
    "cuda",
    "speculative-decoding",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=42",
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
    "mlx-vlm==0.7.9",
    "nanobind==3.1.0",
    "numpy>=2",
]

[project.optional-dependencies]
cuda = ["mlx[cuda12]==0.32.4"]
cuda12 = ["mlx[cuda12]==0.32.4"]
cuda13 = ["mlx[cuda13]==0.32.4"]
cpu = ["mlx[cpu]==0.32.4"]

[project.urls]
Homepage = "https://github.com/northriv/Quanteeze"
Repository = "https://github.com/northriv/Quanteeze"
Documentation = "https://github.com/northriv/Quanteeze#readme"
Issues = "https://github.com/northriv/Quanteeze/issues"

[project.scripts]
quanteeze = "quanteeze.serve:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.build-backend]
source-include = [
    "README.ja.md",
    "CITATION.cff",
    "docs/images/**",
    "tests/**",
    "bench/**",
    "scripts/**",
]
source-exclude = [
    "/tests/test_local_*.py",
    "/CLAUDE.md",
    "/src/quanteeze/vendor/nemotron_image/**",
    "**/__pycache__",
    "**/*.py[cod]",
]
wheel-exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "quanteeze/vendor/deepseek_v4/tests/**",
    "quanteeze/vendor/deepseek_v41/tests/**",
    "quanteeze/vendor/nemotron_image/**",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
